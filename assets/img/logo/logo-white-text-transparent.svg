<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 150 50" width="150" height="50">
  <defs>
    <!-- Accent Gradient for Code Icon and Dot (Kept for pop) -->
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- Canvas Background removed for transparency -->

  <!-- Code Bracket Icon </ > (Retained with gradient) -->
  <g stroke="url(#accent)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <polyline points="14,19 8,25 14,31"/>
    <line x1="18" y1="32" x2="22" y2="18"/>
    <polyline points="26,19 32,25 26,31"/>
  </g>

  <!-- Main Brand Name (Text changed to black for transparency) -->
  <text x="40" y="27" fill="#fff" font-family="'JetBrains Mono', 'Fira Code', 'Segoe UI', monospace" font-size="13" font-weight="700" letter-spacing="-0.3">
    Lorem<tspan fill="#3ff">.</tspan>
  </text>

  <!-- Subtitle / Role Tag (Text changed to a neutral gray for transparency) -->
  <text x="40" y="37" fill="#fff" font-family="'Inter', 'Segoe UI', sans-serif" font-size="7.5" font-weight="600" letter-spacing="1.2">
    DEV STUDIO
  </text>
</svg>
